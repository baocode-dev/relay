[package]
name = "baocode-relay"
version = "0.1.0"
edition = "2024"
publish = false
description = "BaoCode's iroh relay: admission by device key, bans, rate limits"

[dependencies]
iroh-relay = { version = "=1.4.1", features = ["server"] }
iroh-base = "=1.4.1"
iroh-metrics = { version = "1.0.2", features = ["service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "fs", "time", "sync"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"

[dev-dependencies]
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tempfile = "3"
rcgen = "0.14"

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
